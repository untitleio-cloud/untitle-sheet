// ===== CATALOG (Binance futures: crypto + TradFi perpetuals, cached 7 days) =====
async function loadCatalog() {
  if (catalog) return catalog;
  if (catalogPromise) return catalogPromise;
  if (dataSource === 'coingecko' || dataSource === 'hyperliquid') return Promise.resolve(null);
  catalogPromise = (async () => {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem('catalogCache') || 'null'); } catch(e) {}
    if (cache && cache.ts && cache.binanceMap && Date.now() - cache.ts < 7 * 24 * 3600 * 1000) {
      catalog = cache;
      catalogPromise = null;
      return catalog;
    }
    const binance = [];
    const binanceMap = {};
    try {
      const res = await fetch('https://fapi.binance.com/fapi/v1/exchangeInfo');
      if (res.ok) {
        const d = await res.json();
        (d.symbols || []).forEach(s => {
          if (s.status === 'TRADING' && s.quoteAsset === 'USDT') {
            const tradfi = s.contractType === 'TRADIFI_PERPETUAL';
            binance.push({
              ticker: s.baseAsset,
              symbol: s.symbol,
              realName: tradfi ? s.baseAsset + ' Perpetual' : s.symbol,
              type: tradfi ? 'stock' : 'crypto'
            });
            if (tradfi) binanceMap[s.baseAsset] = 'stock';
            else if (!binanceMap[s.baseAsset]) binanceMap[s.baseAsset] = 'crypto';
          }
        });
      }
    } catch(e) {}
    if (!binance.length) {
      try { localStorage.removeItem('catalogCache'); } catch(e) {}
      catalog = null;
      catalogPromise = null;
      return null;
    }
    catalog = { ts: Date.now(), binance, binanceMap };
    try {
      if (binance.length) localStorage.setItem('catalogCache', JSON.stringify(catalog));
    } catch(e) {}
    catalogPromise = null;
    return catalog;
  })();
  return catalogPromise;
}

function filterCatalog(q) {
  const ql = (q || '').toLowerCase().trim();
  const out = [];
  const seen = new Set();
  ASSETS.forEach(a => {
    if (!ql || a.ticker.toLowerCase().includes(ql) || a.realName.toLowerCase().includes(ql) || a.code.toLowerCase().includes(ql)) {
      seen.add(a.ticker);
      out.push({ ticker: a.ticker, realName: a.realName, type: a.type, code: a.code, src: 'binance' });
    }
  });
  if (catalog && catalog.binance) {
    const scored = [];
    for (const x of catalog.binance) {
      const t = x.ticker.toLowerCase();
      let score = -1;
      if (!ql) score = 3;
      else if (t === ql) score = 0;
      else if (t.startsWith(ql)) score = 1;
      else if (t.includes(ql) || x.symbol.toLowerCase().includes(ql)) score = 2;
      if (score < 0) continue;
      scored.push({ ticker: x.ticker, realName: x.realName, type: x.type, score, src: 'binance' });
    }
    scored.sort((a, b) => a.score - b.score);
    let n = 0;
    for (const x of scored) {
      if (seen.has(x.ticker)) continue;
      seen.add(x.ticker);
      out.push(x);
      if (++n >= (ql ? 40 : 15)) break;
    }
  }
  return out.slice(0, 90);
}

function attachAutocomplete(editor, cellEl, row) {
  acRow = row;
  acIndex = -1;
  acResults = [];
  const panel = document.getElementById('acPanel');
  const rect = cellEl.getBoundingClientRect();
  panel.style.top = (rect.bottom + 2) + 'px';
  panel.style.left = rect.left + 'px';
  panel.innerHTML = '';

  const search = document.createElement('input');
  search.className = 'ac-search';
  search.type = 'text';
  search.placeholder = 'Search NASDAQ & crypto...';
  panel.appendChild(search);

  const list = document.createElement('div');
  list.className = 'ac-results';
  panel.appendChild(list);

  const foot = document.createElement('div');
  foot.className = 'ac-foot';
  const status = document.createElement('span');
  status.className = 'ac-header';
  foot.appendChild(status);
  const srcBtn = document.createElement('button');
  srcBtn.className = 'ac-src-btn';
  srcBtn.type = 'button';
  srcBtn.textContent = 'Change source\u2026';
  srcBtn.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    hideAcPanel();
    openApiSourcesModal();
  });
  foot.appendChild(srcBtn);
  panel.appendChild(foot);

  panel.classList.add('show');

  function renderList() {
    list.innerHTML = '';
    if (!acResults.length) {
      const empty = document.createElement('div');
      empty.className = 'ac-loading';
      empty.textContent = 'No matches';
      list.appendChild(empty);
      return;
    }
    acResults.forEach((r, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item' + (i === acIndex ? ' active' : '');
      const code = document.createElement('span');
      code.className = 'ac-code';
      code.textContent = r.ticker + (r.type === 'crypto' ? ' \u20B4' : '');
      const name = document.createElement('span');
      name.className = 'ac-name';
      name.textContent = r.realName;
      item.appendChild(code);
      item.appendChild(name);
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        applyAssetToRow(row, r);
      });
      list.appendChild(item);
    });
    const act = list.querySelector('.ac-item.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
  }

  let acSeq = 0;
  let acTimer = null;

  function builtinMatches(q) {
    const ql = q.toLowerCase();
    return ASSETS.filter(a => !q || a.ticker.toLowerCase().includes(ql) || a.realName.toLowerCase().includes(ql))
      .map(a => ({ ticker: a.ticker, realName: a.realName, type: a.type, code: a.code, src: 'binance' }));
  }

  function localMatches(q) {
    const ql = (q || '').toLowerCase();
    const out = builtinMatches(q);
    const seen = {};
    out.forEach(r => { seen[r.ticker] = true; });
    if (dataSource === 'hyperliquid' && hlSnapshot) {
      Object.keys(hlSnapshot).forEach(t => {
        if (out.length >= 60 || seen[t]) return;
        if (!ql || t.toLowerCase().includes(ql)) {
          out.push({ ticker: t, realName: hlSnapshot[t].type === 'crypto' ? t + ' (Hyperliquid)' : t + ' perp (Hyperliquid)', type: hlSnapshot[t].type });
          seen[t] = true;
        }
      });
    }
    for (const [t, n] of POPULAR_US) {
      if (out.length >= 30) break;
      if (seen[t]) continue;
      if (!ql || t.toLowerCase().includes(ql) || n.toLowerCase().includes(ql)) {
        out.push({ ticker: t, realName: n, type: 'stock' });
        seen[t] = true;
      }
    }
    return out;
  }

  const NAME_HINTS = (() => {
    const m = {};
    POPULAR_US.forEach(p => { m[p[0]] = p[1].toLowerCase(); });
    Object.keys(CG_IDS).forEach(t => { if (!m[t]) m[t] = CG_IDS[t].replace(/-/g, ' '); });
    return m;
  })();

  function hlMatches(q) {
    if (!hlSnapshot) return [];
    const ql = (q || '').toLowerCase();
    return Object.keys(hlSnapshot).filter(t => !ql || t.toLowerCase().includes(ql) || (NAME_HINTS[t] && NAME_HINTS[t].includes(ql)))
      .map(t => {
        const hint = NAME_HINTS[t];
        const suffix = hlSnapshot[t].type === 'stock' ? ' perp (Hyperliquid)' : ' (Hyperliquid)';
        return { ticker: t, realName: (hint ? hint.replace(/\b\w/g, c => c.toUpperCase()) : t) + suffix, type: hlSnapshot[t].type };
      });
  }

  const FH_CRYPTO = { BTC: 'Bitcoin', ETH: 'Ethereum', SOL: 'Solana', DOGE: 'Dogecoin', XRP: 'Ripple' };

  function cgLocalMatches(q) {
    const ql = (q || '').toLowerCase();
    const out = ASSETS.filter(a => a.type === 'crypto' && (!ql || a.ticker.toLowerCase().includes(ql) || a.realName.toLowerCase().includes(ql)))
      .map(a => ({ ticker: a.ticker, realName: a.realName, type: 'crypto', code: a.code }));
    const seen = {};
    out.forEach(r => { seen[r.ticker] = true; });
    Object.keys(CG_IDS).forEach(t => {
      if (seen[t] || ql && !t.toLowerCase().includes(ql)) return;
      out.push({ ticker: t, realName: CG_IDS[t].replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), type: 'crypto', cgId: CG_IDS[t] });
    });
    return out;
  }

  let acBusy = false;

  function update(q) {
    acIndex = -1;
    clearTimeout(acTimer);
    const mode = dataSource;
    if (mode === 'binance') {
      if (catalog) {
        acResults = filterCatalog(q);
        renderList();
        status.textContent = 'Binance ' + (catalog.binance || []).length.toLocaleString() + ' symbols';
      } else {
        acResults = [];
        renderList();
        status.textContent = 'Loading Binance list\u2026';
        if (!catalogPromise) loadCatalog().then(() => { if (!document.body.contains(panel)) return; update(search.value); });
      }
      return;
    }
    if (mode === 'hyperliquid') {
      acResults = hlMatches(q);
      renderList();
      if (hlSnapshot) status.textContent = 'Hyperliquid ' + Object.keys(hlSnapshot).length + ' markets';
      else {
        status.textContent = 'Loading Hyperliquid list\u2026';
        if (!acBusy) { acBusy = true; hlLoadSnapshot().then(() => { acBusy = false; if (document.body.contains(panel)) update(search.value); }); }
      }
      return;
    }
    if (mode === 'coingecko') {
      acResults = cgLocalMatches(q);
      renderList();
      if (!q) { status.textContent = 'CoinGecko built-in list'; return; }
      status.textContent = 'Searching CoinGecko\u2026';
      const seq = ++acSeq;
      acTimer = setTimeout(() => {
        fetch('https://api.coingecko.com/api/v3/search?query=' + encodeURIComponent(q))
          .then(res => (res.ok ? res.json() : Promise.reject()))
          .then(d => {
            if (seq !== acSeq) return;
            const seen = {};
            acResults.forEach(r => { seen[r.ticker] = true; });
            const extra = [];
            ((d && d.coins) || []).forEach(c => {
              if (extra.length >= 20) return;
              const t = String(c.symbol || '').toUpperCase();
              if (!/^[A-Z][A-Z0-9.\-]{0,11}$/.test(t) || seen[t]) return;
              seen[t] = true;
              extra.push({ ticker: t, realName: c.name, type: 'crypto', cgId: c.id });
            });
            acResults = acResults.concat(extra);
            renderList();
            status.textContent = 'CoinGecko search';
          })
          .catch(() => { if (seq === acSeq) status.textContent = 'CoinGecko unavailable'; });
      }, 350);
      return;
    }
    acResults = localMatches(q);
    renderList();
    if (!q) { status.textContent = 'Self-hosted search (Yahoo)'; return; }
    status.textContent = 'Searching NASDAQ & crypto\u2026';
    const seq = ++acSeq;
    acTimer = setTimeout(() => {
      fetch('/api/search?q=' + encodeURIComponent(q))
        .then(res => (res.ok ? res.json() : Promise.reject()))
        .then(d => {
          if (seq !== acSeq) return;
          const seen = {};
          acResults.forEach(r => { seen[r.ticker] = true; });
          acResults = acResults.concat(((d && d.results) || []).filter(r => !seen[r.ticker]));
          renderList();
          status.textContent = 'Self-hosted search (Yahoo)';
        })
        .catch(() => { if (seq === acSeq) status.textContent = 'Search unavailable'; });
    }, 250);
  }
  update('');
  search.addEventListener('input', () => update(search.value));
  search.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acResults.length - 1, acIndex + 1); renderList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(0, acIndex - 1); renderList(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (acIndex >= 0) applyAssetToRow(row, acResults[acIndex]);
      else {
        const t = (search.value || '').trim().toUpperCase();
        if (/^[A-Z][A-Z0-9.\-]{0,11}$/.test(t)) applyAssetToRow(row, { ticker: t, realName: t, type: 'stock', src: dataSource });
      }
    }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hideAcPanel(); editor.focus(); }
  });
  search.addEventListener('blur', () => {
    setTimeout(() => {
      if (!panel.contains(document.activeElement) && document.activeElement !== editor) hideAcPanel();
    }, 150);
  });


  update('');
  setTimeout(() => search.focus(), 0);
}

function applyAssetToRow(row, sel) {
  pushHistory();
  const prev = rowAssets[row];
  let code = sel.code;
  if (!code || Object.entries(rowAssets).some(([r, a]) => a.code === code && +r !== row)) code = nextAlias();
  const name = (prev && prev.name) ? prev.name : codenameFor(sel.realName, code);
  const inv = (prev && prev.inv) ? prev.inv : (sel.type === 'crypto' ? 2 : 100);
  rowAssets[row] = { ticker: sel.ticker, realName: sel.realName, type: sel.type, code, name, inv };
  if (sel.cgId) rowAssets[row].cgId = sel.cgId;
  saveRowAssets();
  feedSymbolsChanged();

  const p = prices[sel.ticker];
  writeCell(row, 'code', code);
  writeCell(row, 'name', name);
  writeCell(row, 'price', p ? formatPrice(p.price) : '0.00');
  writeCell(row, 'change', p ? formatPct(p.change) : '+0.00%');
  writeCell(row, 'inv', String(inv));
  setBudget(row);
  writeCell(row, 'status', p ? (p.change >= 2 ? 'On Track' : p.change >= 0 ? 'Stable' : p.change >= -2 ? 'Monitor' : 'Review') : 'Pending');
  COL_HEADERS.forEach(col => { delete cellStyles[row + col]; });
  saveData();

  editingCell = null;
  const ed = document.querySelector('.cell-editor');
  if (ed) ed.remove();
  hideAcPanel();
  renderGrid();
  showToast(sel.ticker + ' → ' + code);
  if (!p) {
    fetchPriceFor(sel).then(got => {
      if (got) {
        const p2 = prices[sel.ticker];
        const inv2 = (rowAssets[row] && rowAssets[row].inv) || inv;
        writeCell(row, 'price', formatPrice(p2.price));
        writeCell(row, 'change', formatPct(p2.change));
        setBudget(row);
        writeCell(row, 'status', p2.change >= 2 ? 'On Track' : p2.change >= 0 ? 'Stable' : p2.change >= -2 ? 'Monitor' : 'Review');
        saveData();
      } else {
        writeCell(row, 'status', 'No Data');
        saveData();
        showToast(`No live price source found for ${sel.ticker}`);
      }
      renderGrid();
      if (selectedCell) updateCellName(selectedCell);
    });
  }
}

let hlSnapshot = null;
let hlSnapshotAt = 0;
let hlError = '';
let hlSnapshotPromise = null;
let hlBlocked = false;

function hlPost(body) {
  return fetch('https://api.hyperliquid.xyz/info', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(r => (r.ok ? r.json() : Promise.reject(new Error('hl ' + r.status))));
}

function hlLoadSnapshot() {
  if (hlSnapshot && Date.now() - hlSnapshotAt < 30000) return Promise.resolve(hlSnapshot);
  if (hlSnapshotPromise) return hlSnapshotPromise;
  const build = (main, xyz) => {
    const snap = {};
    const fill = (pair, type) => {
      if (!pair || !pair[0] || !pair[1]) return;
      pair[0].universe.forEach((u, i) => {
        const ctx = pair[1][i];
        if (!ctx) return;
        const raw = String(u.name);
        const t = raw.includes(':') ? raw.split(':')[1] : raw;
        const px = parseFloat(ctx.markPx || ctx.midPx);
        const prev = parseFloat(ctx.prevDayPx);
        if (!isFinite(px) || px <= 0 || !/^[A-Z][A-Z0-9.\-]{0,11}$/.test(t)) return;
        const entry = { price: px, change: isFinite(prev) && prev > 0 ? (px / prev - 1) * 100 : 0, type };
        if (snap[t] && snap[t].type === 'crypto' && type === 'stock') return;
        snap[t] = entry;
      });
    };
    fill(main, 'crypto');
    fill(xyz, 'stock');
    return snap;
  };
  const relay = selfhostAvailable
    ? fetch('/api/hl').then(r => (r.ok ? r.json() : Promise.reject())).then(snap => {
        if (!snap || snap.error || !Object.keys(snap).length) throw new Error('hl relay empty');
        return snap;
      })
    : Promise.reject(new Error('no relay'));
  hlSnapshotPromise = relay.catch(() => Promise.all([
    hlPost({ type: 'metaAndAssetCtxs' }),
    hlPost({ type: 'metaAndAssetCtxs', dex: 'xyz' }).catch(() => null),
  ]).then(([main, xyz]) => build(main, xyz))).then(snap => {
    hlSnapshot = snap;
    hlSnapshotAt = Date.now();
    hlBlocked = false;
    return snap;
  }).catch(e => {
    hlBlocked = true;
    hlError = String((e && e.message) || e);
    sourceHealth.hyperliquid = 'blocked';
    return null;
  }).finally(() => { hlSnapshotPromise = null; });
  return hlSnapshotPromise;
}

  if (hlBlocked) return false;

  if (!snap) return false;
  const e = snap[ticker.toUpperCase()];
  if (!e) return false;
  prices[ticker] = { price: e.price, change: e.change, src: 'hyperliquid' };
  return true;
}

async function fetchBinanceTicker(ticker) {

    const res = await fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${encodeURIComponent(binanceSymbol(ticker))}`);
    if (res.status === 451 || res.status === 403) { binanceBlocked = true; sourceHealth.binance = 'blocked'; return false; }
    if (res.status === 429 || res.status === 418) { noteBinanceLimit(res.status); return false; }
    if (!res.ok) return false;
    const d = await res.json();
    if (!d || !d.lastPrice) return false;
    prices[ticker] = { price: parseFloat(d.lastPrice), change: parseFloat(d.priceChangePercent) || 0, src: 'binance' };
    return true;
  } catch(e) { binanceBlocked = true; sourceHealth.binance = 'blocked'; return false; }
}

const CG_IDS = { BTC: 'bitcoin', ETH: 'ethereum', SOL: 'solana', DOGE: 'dogecoin', XRP: 'ripple', ADA: 'cardano', BNB: 'binancecoin', AVAX: 'avalanche-2', LINK: 'chainlink', MATIC: 'polygon-pos', DOT: 'polkadot', TRX: 'tron', SHIB: 'shiba-inu', UNI: 'uniswap', LTC: 'litecoin', PEPE: 'pepe' };

function cgIdFor(ticker) {
  const t = ticker.toUpperCase();
  const a = Object.values(rowAssets).find(x => x.ticker.toUpperCase() === t && x.cgId);
  return a ? a.cgId : (CG_IDS[t] || null);
}

async function fetchCoinGeckoTicker(ticker) {
  const id = cgIdFor(ticker);
  if (!id || Date.now() < cgLimitedUntil) return false;
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + encodeURIComponent(id) + '&vs_currencies=usd&include_24hr_change=true');
    if (res.status === 429) { cgLimitedUntil = Date.now() + 60000; return false; }
    if (res.status === 451 || res.status === 403) { sourceHealth.coingecko = 'blocked'; return false; }
    if (!res.ok) { if (++cgNetFails >= 2) sourceHealth.coingecko = 'blocked'; return false; }
    const d = await res.json();
    const e = d && d[id];
    if (!e || !isFinite(e.usd) || e.usd <= 0) return false;
    prices[ticker] = { price: e.usd, change: isFinite(e.usd_24h_change) ? e.usd_24h_change : 0, src: 'coingecko' };
    return true;
  } catch(e) { if (++cgNetFails >= 2) sourceHealth.coingecko = 'blocked'; return false; }
}

async function fetchTicker(ticker, type) {
  if (dataSource === 'selfhost') return fetchSelfhostTicker(ticker, type);
  if (dataSource === 'hyperliquid') return fetchHyperliquidTicker(ticker);
  if (dataSource === 'coingecko') return type === 'crypto' ? fetchCoinGeckoTicker(ticker) : Promise.resolve(false);
  return fetchBinanceTicker(ticker);
}

function binanceEligible(a) {
  if (catalog && catalog.binanceMap) return catalog.binanceMap[a.ticker.toUpperCase()] === a.type;
  return a.type === 'crypto';
}

async function fetchPrices() {
  prices = {};
  let ok = false;
  const assets = Object.values(rowAssets);

  const eligible = a => dataSource === 'binance' ? binanceEligible(a) : dataSource === 'coingecko' ? a.type === 'crypto' : true;
  const typeOf = {};
  assets.forEach(a => { typeOf[a.ticker] = a.type; });
  const tickers = [...new Set(assets.filter(eligible).map(a => a.ticker))];
  for (let i = 0; i < tickers.length; i++) {
    if (await fetchTicker(tickers[i], typeOf[tickers[i]])) ok = true;
    if (i < tickers.length - 1) await new Promise(r => setTimeout(r, 150));
  }
  return ok;
}

let lastAutoSwitch = 0;
let pendingRetries = 0;
let retryGen = 0;

function hasPendingBound() {
  return Object.values(rowAssets).some(a => {
    if (prices[a.ticker]) return false;
    if (dataSource === 'binance') return binanceEligible(a);
    if (dataSource === 'coingecko') return a.type === 'crypto';
    return true;
  });
}

function schedulePendingRetry() {
  if (!hasPendingBound() || pendingRetries >= 3) return;
  const delays = [5000, 15000, 45000];
  const gen = retryGen;
  setTimeout(() => {
    if (gen !== retryGen) return;
    pendingRetries++;
    refreshMarket(true).then(() => {
      renderGrid();
      schedulePendingRetry();
    });
  }, delays[Math.min(pendingRetries, 2)]);
}

function autoSwitchFromBlocked() {
  if (Date.now() - lastAutoSwitch < 60000) return;
  const sel = dataSource;
  if (sel === 'selfhost') return;
  const selBlocked = sel === 'binance' ? binanceBlocked : sourceHealth[sel] === 'blocked';
  if (!selBlocked) return;
  const alt = ['selfhost', 'hyperliquid', 'binance', 'coingecko'].find(k =>
    k !== sel && (k === 'selfhost' ? selfhostAvailable : k === 'hyperliquid' ? !hlBlocked : k === 'binance' ? !binanceBlocked : sourceHealth.coingecko !== 'blocked'));
  if (!alt) return;
  lastAutoSwitch = Date.now();
  applyDataSource(alt);
  showToast(`Price source switched to ${alt} (${sel} unreachable)`);
}

async function autoPickSource() {
  try {
    const [b, c, h] = await Promise.all([probeSource('binance'), probeSource('coingecko'), probeSource('hyperliquid')]);
    if (b === 'blocked') sourceHealth.binance = 'blocked';
    if (c === 'blocked') sourceHealth.coingecko = 'blocked';
    if (h === 'blocked') sourceHealth.hyperliquid = 'blocked';
    const reachable = k => k === 'selfhost' ? selfhostAvailable : k === 'hyperliquid' ? h !== 'blocked' : k === 'binance' ? b !== 'blocked' : k === 'coingecko' ? c !== 'blocked' : false;
    if (!localStorage.getItem('dataSource')) {
      dataSource = ['selfhost', 'hyperliquid', 'binance', 'coingecko'].find(reachable) || 'binance';
    } else if (!reachable(dataSource)) {
      const alt = ['selfhost', 'hyperliquid', 'binance', 'coingecko'].find(k => k !== dataSource && reachable(k));
      if (alt) {
        const from = dataSource;
        dataSource = alt;
        localStorage.setItem('dataSource', alt);
        showToast(`Price source switched to ${alt} (${from} unreachable from your region)`);
      }
    }
  } catch(e) {}
}

function budgetFormula(r) {
  const P = colL('price'), I = colL('inv');
  return P && I ? '=' + P + (r + 1) + '*' + I + (r + 1) : '0.00';
}

function setBudget(r) {
  const L = colL('budget');
  if (L === null) return;
  const cur = cellData[r + L];
  if (typeof cur === 'string' && cur.startsWith('=') && cur !== budgetFormula(r)) return;
  cellData[r + L] = budgetFormula(r);
}

function formatPrice(p) {
  if (p > 0 && p < 1) return p.toLocaleString('en-US', { minimumSignificantDigits: 3, maximumSignificantDigits: 6 });
  return p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatPct(p) {
  return (p >= 0 ? '+' : '') + p.toFixed(2) + '%';
}

function recalcBudget(row) {
  const a = rowAssets[row];
  if (!a) return;
  const LI = colL('inv');
  const inv = LI ? parseInt(String(cellData[row + LI] || '').replace(/[^0-9.\-]/g, '')) : 0;
  if (isNaN(inv)) return;
  let price;
  if (prices[a.ticker]) {
    price = prices[a.ticker].price;
  } else {
    const LP = colL('price');
    price = LP ? parseFloat(String(cellData[row + LP] || '').replace(/[^0-9.\-]/g, '')) : NaN;
    if (isNaN(price)) price = 0;
  }
  setBudget(row);
}

function updateMarketData(recordHistory) {
  if (recordHistory !== false) pushHistory();
  Object.entries(rowAssets).forEach(([rs, a]) => {
    const r = +rs;
    const p = prices[a.ticker];
    if (!p) {
      writeCell(r, 'price', 'No Data');
      writeCell(r, 'status', 'Pending');
      return;
    }
    const inv = (colL('inv') && parseInt(cellData[r + colL('inv')])) || a.inv;
    writeCell(r, 'price', formatPrice(p.price));
    writeCell(r, 'change', formatPct(p.change));
    setBudget(r);
    writeCell(r, 'status', p.change >= 2 ? 'On Track' : p.change >= 0 ? 'Stable' : p.change >= -2 ? 'Monitor' : 'Review');
  });
  saveData();
  renderGrid();
}

function resetTextFormatting() {
  if (!confirm('Reset all text and formatting?\n\nItem bindings and prices are kept. This can be undone with Ctrl+Z.')) return;
  pushHistory();
  cellStyles = {};
  Object.entries(colMap).forEach(([k, c]) => {
    if (COL_LABEL_FOR[k] === undefined) return;
    cellData['0' + COL_HEADERS[c]] = COL_LABEL_FOR[k];
  });
  Object.entries(rowAssets).forEach(([rs, a]) => {
    const r = +rs;
    writeCell(r, 'code', a.code);
    writeCell(r, 'inv', String(a.inv));
  });
  updateMarketData(false);
  pendingRetries = 0;
  schedulePendingRetry();
  if (selectedCell) updateCellName(selectedCell);
  showToast('Text & formatting reset');
}

function resetEverything() {
  if (!confirm('Delete ALL data and restore the default sheet?\n\nBindings, text, formatting, column/row sizes, the document title and your settings (price source, API keys) are erased. This cannot be undone.')) return;

  localStorage.removeItem('dataSource');
  docTitle.textContent = 'Untitled spreadsheet';

function applyDataSource(k) {
  dataSource = k;
  localStorage.setItem('dataSource', k);
  Object.keys(prices).forEach(t => { if (prices[t].src !== k) delete prices[t]; });
  binanceBlocked = false;
  rateLimitedUntil = 0;
  binanceLimitedUntil = 0;
  cgNetFails = 0; cgLimitedUntil = 0;
  pendingRetries = 0;
  retryGen++;
  hlSnapshot = null;
  hlBlocked = false;
  sourceHealth = {};
  if (k !== 'binance' && ws) { try { ws.onclose = null; ws.close(); } catch(e) {} ws = null; }
  feedSymbolsChanged();
  setFeed(k === 'binance' ? null : 'rest');
  const after = () => {
    renderGrid();
    if (selectedCell) updateCellName(selectedCell);
  };
  if (k === 'binance') {
    loadCatalog().then(() => refreshMarket(true)).then(after);
    if (isLeader) openWS();
  } else {
    refreshMarket(true).then(after);
  }
}

const SRC_META = [
  ['binance', 'Binance', 'fapi.binance.com \u00B7 crypto + stock perpetuals'],
  ['hyperliquid', 'Hyperliquid', 'api.hyperliquid.xyz \u00B7 free \u00B7 crypto + 100+ stock perps'],
  ['coingecko', 'CoinGecko', 'api.coingecko.com \u00B7 free \u00B7 crypto only (no stocks)'],
];

function probeUrl(url) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) { try { ctl.abort(); } catch(e) {} } }, 6000);
  return fetch(url, ctl ? { signal: ctl.signal } : undefined)
    .then(res => {
      clearTimeout(timer);
      if (res.status === 451 || res.status === 403 || res.status === 401) return 'blocked';
      return res.ok ? 'ok' : 'blocked';
    })
    .catch(() => { clearTimeout(timer); return 'blocked'; });
}

function srcList() {
  return selfhostAvailable
    ? SRC_META.concat([['selfhost', 'Self-hosted API', '/api/quote \u00B7 stocks + crypto \u00B7 same origin']])
    : SRC_META;
}

function probeSource(kind) {
  if (kind === 'hyperliquid') {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) { try { ctl.abort(); } catch(e) {} } }, 6000);
    return hlPost({ type: 'allMids' })
      .then(d => { clearTimeout(timer); return d && Object.keys(d).length ? 'ok' : 'blocked'; })
      .catch(() => { clearTimeout(timer); return 'blocked'; });
  }
  if (kind === 'selfhost') {
    return fetch('/api/quote?probe=1')
      .then(res => (res.ok ? res.json() : Promise.reject()))
      .then(d => (d && d.ok ? 'ok' : 'blocked'))
      .catch(() => 'blocked');
  }
  return probeUrl(kind === 'binance' ? 'https://fapi.binance.com/fapi/v1/time' : 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
}

    const row = document.createElement('div');

    rb.type = 'radio';
    rb.name = 'apiSrc';

    rows[k] = { row, rb, st };
  });

  function applyProbe(k) {
    const { row, rb, st } = rows[k];
    probeSource(k).then(status => {
      sourceHealth[k] = status === 'nokey' ? undefined : status;
      if (status === 'ok') {
        st.textContent = 'OK';
        st.classList.add('ok');
        st.classList.remove('blocked');
        rb.disabled = false;
        row.classList.remove('disabled');
      } else if (status === 'nokey') {
        st.textContent = 'Key required';
        st.classList.add('blocked');
        st.classList.remove('ok');
        rb.checked = false;
        rb.disabled = true;
        row.classList.add('disabled');
        const other = Object.keys(rows).find(o => o !== k && !rows[o].rb.disabled);
        if (dataSource === k && other) rows[other].rb.checked = true;
      } else {
        st.textContent = k === 'hyperliquid' && hlError ? 'Unreachable: ' + hlError : 'Blocked in your region';

        st.classList.remove('ok');

        rb.disabled = true;
        row.classList.add('disabled');

        if (dataSource === k && other) rows[other].rb.checked = true;

  const foot = document.createElement('div');

  const cancel = document.createElement('button');

  const save = document.createElement('button');

  save.textContent = 'Save';

  modal.appendChild(h);
  modal.appendChild(sub);
  modal.appendChild(body);
  modal.appendChild(foot);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

    if (!overlay.isConnected) { document.removeEventListener('keydown', escClose, true); return; }
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
  }
  function close() {
    document.removeEventListener('keydown', escClose, true);
    overlay.remove();
  }
  document.addEventListener('keydown', escClose, true);
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
  cancel.addEventListener('click', close);

  save.addEventListener('click', () => {
    let sel = dataSource;
    Object.keys(rows).forEach(k => { if (rows[k].rb.checked && !rows[k].rb.disabled) sel = k; });
    close();
    applyDataSource(sel);
    showToast('Price source saved');

  srcList().forEach(([k]) => { applyProbe(k); });
}

const WSS_BASE = 'wss://fstream.binance.com/stream?streams=';
let ws = null;
let wsBackoff = 1;
let wsReopenTimer = null;
let wsGotData = false;
let rateLimitedUntil = 0;
let symbolToTicker = {};
let bc = null;
const tabId = Math.random().toString(36).slice(2);
let isLeader = false;
let heartbeatTimer = null;
let lastSeenLeader = 0;
let tabSymbols = [];
let knownTabs = {};
let dataDirty = false;

function binanceSymbol(ticker) {
  return ticker.toUpperCase().replace(/[^A-Z0-9]/g, '') + 'USDT';
}

function wsEligible(a) {
  if (!catalog || !catalog.binanceMap) return false;
  return catalog.binanceMap[a.ticker.toUpperCase()] === a.type;
}

function rebuildSymbolMap() {
  symbolToTicker = {};
  tabSymbols = [];
  Object.values(rowAssets).forEach(a => {
    if (!wsEligible(a)) return;
    const sym = binanceSymbol(a.ticker);
    if (!symbolToTicker[sym]) symbolToTicker[sym] = a.ticker;
    tabSymbols.push(sym);
  });
}

function saveLastPrices() {
  try { localStorage.setItem('lastPrices', JSON.stringify(prices)); } catch(e) {}
}
function loadLastPrices() {
  try {
    const d = JSON.parse(localStorage.getItem('lastPrices') || 'null');
    if (d) prices = { ...d, ...prices };
  } catch(e) {}
}

const SRC_NAMES = { binance: 'Binance', coinbase: 'Coinbase', coingecko: 'CoinGecko', finnhub: 'Finnhub', selfhost: 'Self-hosted', hyperliquid: 'Hyperliquid' };

function dominantSrc() {
  const cnt = {};
  Object.values(rowAssets).forEach(a => {
    const s = prices[a.ticker] && prices[a.ticker].src;
    if (s) cnt[s] = (cnt[s] || 0) + 1;
  });
  let best = null, n = 0;
  Object.keys(cnt).forEach(s => { if (cnt[s] > n) { n = cnt[s]; best = s; } });
  return best;
}

function setFeed(kind) {
  const el = document.getElementById('feedStatus');
  if (!el) return;
  const txt = document.getElementById('feedText');
  el.classList.remove('ws', 'rest', 'cached');
  if (kind) el.classList.add(kind);
  txt.textContent = kind === 'ws' ? 'Live \u00B7 Binance WS' : kind === 'rest' ? 'Polling \u00B7 ' + (SRC_NAMES[dominantSrc()] || 'REST') : kind === 'cached' ? 'Cached (rate limited)' : 'Idle';
}

function noteRateLimit(status) {
  if (status === 429) rateLimitedUntil = Math.max(rateLimitedUntil, Date.now() + 60000);
  else if (status === 418) {
    rateLimitedUntil = Math.max(rateLimitedUntil, Date.now() + 30 * 60000);
    if (ws) { try { ws.onclose = null; ws.close(); } catch(e) {} ws = null; }
  } else return;
  setFeed('cached');
}

let binanceLimitedUntil = 0;
function noteBinanceLimit(status) {
  if (status === 418) {
    rateLimitedUntil = Math.max(rateLimitedUntil, Date.now() + 30 * 60000);
    if (ws) { try { ws.onclose = null; ws.close(); } catch(e) {} ws = null; }
    setFeed('cached');
  } else if (status === 429) {
    binanceLimitedUntil = Math.max(binanceLimitedUntil, Date.now() + 60000);
  }
}

function updateLiveRow(r) {
  const a = rowAssets[r];
  if (!a) return;
  const p = prices[a.ticker];
  if (!p) return;
  if (editingCell && editingCell.row === r) return;
  const inv = (colL('inv') && parseInt(cellData[r + colL('inv')])) || a.inv;
  writeCell(r, 'price', formatPrice(p.price));
  writeCell(r, 'change', formatPct(p.change));
  setBudget(r);
  writeCell(r, 'status', p.change >= 2 ? 'On Track' : p.change >= 0 ? 'Stable' : p.change >= -2 ? 'Monitor' : 'Review');
  [colL('price'), colL('change'), colL('budget'), colL('status')].filter(Boolean).forEach(col => {
    const el = getCellElement(r, COL_HEADERS.indexOf(col));
    if (el) {
      const cc = el.querySelector('.cell-content');
      if (cc) cc.textContent = cellData[r + col];
    }
  });
  dataDirty = true;
}

function applyLivePrice(ticker, price, change) {
  prices[ticker] = { price, change };
  Object.keys(rowAssets).forEach(rs => {
    if (rowAssets[rs].ticker === ticker) updateLiveRow(+rs);
  });
}

function unionSymbols() {
  const now = Date.now();
  const set = new Set(tabSymbols);
  Object.values(knownTabs).forEach(t => {
    if (now - t.ts < 15000) t.symbols.forEach(s => set.add(s));
  });
  return [...set];
}

function bcPost(msg) {
  if (bc) try { bc.postMessage({ ...msg, from: tabId }); } catch(e) {}
}

function openWS() {
  clearTimeout(wsReopenTimer);
  if (Date.now() < rateLimitedUntil) {
    setFeed('cached');
    wsReopenTimer = setTimeout(openWS, 60000);
    return;
  }
  if (ws) { try { ws.onclose = null; ws.close(); } catch(e) {} ws = null; }
  const streams = unionSymbols().map(s => (s + '@miniTicker').toLowerCase()).join('/');
  if (!streams) return;
  try { ws = new WebSocket(WSS_BASE + streams); } catch(e) { return; }
  ws.onopen = () => { wsBackoff = 1; };
  ws.onmessage = (ev) => {
    try {
      const m = JSON.parse(ev.data);
      const d = m.data;
      if (!d || !d.s || !d.c) return;
      const ticker = symbolToTicker[d.s];
      if (!ticker) return;
      if (!wsGotData) { wsGotData = true; setFeed('ws'); }
      const price = parseFloat(d.c);
      const open = parseFloat(d.o);
      const change = open ? ((price - open) / open) * 100 : 0;
      applyLivePrice(ticker, price, change);
      bcPost({ type: 'price', ticker, price, change });
    } catch(e) {}
  };
  ws.onclose = () => {
    ws = null;
    if (!isLeader) return;
    if (Date.now() < rateLimitedUntil) {
      wsReopenTimer = setTimeout(openWS, 60000);
      return;
    }
    if (!wsGotData) setFeed('rest');
    wsBackoff = Math.min(16, wsBackoff * 2);
    wsReopenTimer = setTimeout(openWS, 5000 * wsBackoff + Math.random() * 2000);
  };
  ws.onerror = () => {};
}

function promoteSelf() {
  if (isLeader) return;
  isLeader = true;
  wsGotData = false;
  heartbeatTimer = setInterval(() => bcPost({ type: 'heartbeat' }), 3000);
  openWS();
}

function demoteSelf(announce) {
  if (!isLeader) return;
  isLeader = false;
  clearInterval(heartbeatTimer);
  clearTimeout(wsReopenTimer);
  if (ws) { try { ws.onclose = null; ws.close(); } catch(e) {} ws = null; }
  if (announce) bcPost({ type: 'leader-gone' });
}

function onBC(e) {
  const m = e.data;
  if (!m || m.from === tabId) return;
  if (m.type === 'leader-hello') {
    lastSeenLeader = Date.now();
    if (isLeader) {
      if (m.from < tabId) demoteSelf(true);
      else bcPost({ type: 'heartbeat' });
    }
    bcPost({ type: 'symbols', symbols: tabSymbols });
  } else if (m.type === 'heartbeat') {
    lastSeenLeader = Date.now();
    if (isLeader && m.from < tabId) demoteSelf(true);
  } else if (m.type === 'leader-gone') {
    lastSeenLeader = 0;
  } else if (m.type === 'symbols') {
    knownTabs[m.from] = { symbols: m.symbols, ts: Date.now() };
    if (isLeader) openWS();
  } else if (m.type === 'price') {
    if (!wsGotData) { wsGotData = true; setFeed('ws'); }
    applyLivePrice(m.ticker, m.price, m.change);
  }
}

function startFeed() {
  rebuildSymbolMap();
  loadLastPrices();
  if (dataSource !== 'binance') {
    setFeed('rest');
    setInterval(() => {
      if (dataDirty) { dataDirty = false; saveData(); saveLastPrices(); }
    }, 5000);
    return;
  }
  if ('BroadcastChannel' in window) {
    bc = new BroadcastChannel('stx-feed');
    bc.onmessage = onBC;
    bcPost({ type: 'leader-hello' });
    setTimeout(() => {
      if (!isLeader && Date.now() - lastSeenLeader >= 400) promoteSelf();
    }, 450);
    setInterval(() => {
      if (!isLeader && Date.now() - lastSeenLeader > 8000) {
        bcPost({ type: 'leader-hello' });
        setTimeout(() => { if (!isLeader && Date.now() - lastSeenLeader >= 400) promoteSelf(); }, 450);
      }
    }, 3000);
  } else {
    promoteSelf();
  }
  setInterval(() => {
    if (dataDirty) { dataDirty = false; saveData(); saveLastPrices(); }
  }, 5000);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (isLeader) demoteSelf(true);
  } else {
    lastSeenLeader = 0;
    setTimeout(() => {
      bcPost({ type: 'leader-hello' });
      setTimeout(() => { if (!isLeader && Date.now() - lastSeenLeader >= 400) promoteSelf(); }, 450);
    }, 200);
  }
});

function feedSymbolsChanged() {
  rebuildSymbolMap();
  if (dataSource !== 'binance') return;
  if (isLeader) openWS();
  else bcPost({ type: 'symbols', symbols: tabSymbols });
}

// ===== REFRESH / AUTO SYNC =====
const BASE_SYNC_MS = 60000;
const MIN_FETCH_GAP_MS = 15000;
let lastFetchAt = 0;
let liveMode = false;
let liveTimer = null;
let liveBackoff = 1;

async function refreshMarket(force) {
  if (Date.now() < rateLimitedUntil) { setFeed('cached'); return false; }
  if (!force && Date.now() - lastFetchAt < MIN_FETCH_GAP_MS) return true;
  lastFetchAt = Date.now();
  const ok = await fetchPrices();
  updateMarketData(!liveMode);
  if (!wsGotData) setFeed(ok ? 'rest' : 'cached');
  autoSwitchFromBlocked();
  schedulePendingRetry();
  return ok;
}

function liveLabel() {
  const el = document.getElementById('liveLabel');
  el.textContent = liveMode ? `Auto ${Math.round(BASE_SYNC_MS * liveBackoff / 1000)}s` : 'Auto';
}

function scheduleNextSync() {
  clearTimeout(liveTimer);
  if (!liveMode) return;
  liveTimer = setTimeout(async () => {
    if (!document.hidden) {
      const ok = await refreshMarket(false);
      liveBackoff = ok ? (liveBackoff > 1 ? Math.max(1, Math.floor(liveBackoff / 2)) : 1) : Math.min(8, liveBackoff * 2);
      liveLabel();
    }
    scheduleNextSync();
  }, BASE_SYNC_MS * liveBackoff + Math.random() * 5000);
}

function setLive(on) {
  liveMode = on;
  localStorage.setItem('liveMode', on ? '1' : '0');
  document.getElementById('btnLive').classList.toggle('on', on);
  if (on) {
    liveBackoff = 1;
    refreshMarket(false).then(ok => {
      if (!ok) { liveBackoff = 2; liveLabel(); }
    });
  }
  scheduleNextSync();
  liveLabel();
}

document.getElementById('btnLive').addEventListener('click', () => setLive(!liveMode));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(liveTimer);
  } else if (liveMode) {
    refreshMarket(false).then(() => scheduleNextSync());
  }
});

document.getElementById('btnRefresh').addEventListener('click', async () => {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('loading');
  btn.querySelector('span').textContent = 'Refreshing...';
  const ok = await refreshMarket(true);
  btn.classList.remove('loading');
  btn.querySelector('span').textContent = 'Refresh';
  showToast(ok ? 'Market data updated' : 'API rate limited - showing cached data');
});

// ===== TOAST =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}


document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const now = Date.now();
    const dbl = now - lastEscTime < 600;
    lastEscTime = now;
    if (!editingCell && dbl && !document.querySelector('.modal-overlay') && ctxMenu.style.display === 'none' && !fileMenu && !editMenu && !helpMenu && !toolsMenu && !borderMenu && !Object.keys(soonMenus).length) {
      window.location.href = 'https://www.google.com';
      return;
    }
    const ov = document.querySelector('.modal-overlay');
    const anyPopup = ov || ctxMenu.style.display !== 'none' || fileMenu || editMenu || helpMenu || toolsMenu || borderMenu || Object.keys(soonMenus).length;
    if (anyPopup) {
      if (dbl) {
        if (ov) ov.remove();
        hideCtx();
        closeFileMenu();
        closeEditMenu();
        closeHelpMenu();
        closeToolsMenu();
        closeBorderMenu();
        closeSoonMenus();
        lastEscTime = 0;
      }
      return;
    }
  }
  if (editingCell) return;

  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.isContentEditable)) return;

  if (e.key === 'Enter' || e.key === 'F2') {
    e.preventDefault();
    if (selectedCell) startEdit(selectedCell.row, selectedCell.col);
    return;
  }

  if (e.key === 'Tab' && selectedCell) {
    e.preventDefault();
    selectCell(rowWrap(selectedCell.row, selectedCell.col + 1).row, rowWrap(selectedCell.row, selectedCell.col + 1).col);
    return;
  }

  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1 && selectedCell) {
    e.preventDefault();
    startEdit(selectedCell.row, selectedCell.col);
    const ed0 = document.querySelector('.cell-editor');
    if (ed0) {
      ed0.value = e.key;
      ed0.dispatchEvent(new window.Event('input'));
      ed0.setSelectionRange(ed0.value.length, ed0.value.length);
    }
    return;
  }

  if (e.ctrlKey || e.metaKey) {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.isContentEditable)) return;
    if (e.key === 'b') { e.preventDefault(); toggleStyle('bold'); }
    else if (e.key === 'i') { e.preventDefault(); toggleStyle('italic'); }
    else if (e.key === 'u') { e.preventDefault(); toggleStyle('underline'); }
    else if (e.key === 'c') { e.preventDefault(); copySelection(false); }
    else if (e.key === 'x') { e.preventDefault(); copySelection(true); }
    else if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((e.key === 'z' && e.shiftKey) || e.key === 'Z' || e.key === 'y') { e.preventDefault(); redo(); }
    else if (e.key === 'a') { e.preventDefault(); selectAll(); }
    else if (e.key === 'd' && selectedCell) { e.preventDefault(); fillSelection('down'); }
    else if (e.key === 'Home') { e.preventDefault(); selectCell(0, 0); }
    else if (e.key === 'End' && selectedCell) { e.preventDefault(); selectCell(ROWS - 1, COLS - 1); }
    else if (e.key === 'ArrowUp' && selectedCell) { e.preventDefault(); const j = jumpEdge(selectedCell.row, selectedCell.col, -1, 0); selectCell(j.row, j.col, e.shiftKey); }
    else if (e.key === 'ArrowDown' && selectedCell) { e.preventDefault(); const j = jumpEdge(selectedCell.row, selectedCell.col, 1, 0); selectCell(j.row, j.col, e.shiftKey); }
    else if (e.key === 'ArrowLeft' && selectedCell) { e.preventDefault(); const j = jumpEdge(selectedCell.row, selectedCell.col, 0, -1); selectCell(j.row, j.col, e.shiftKey); }
    else if (e.key === 'ArrowRight' && selectedCell) { e.preventDefault(); const j = jumpEdge(selectedCell.row, selectedCell.col, 0, 1); selectCell(j.row, j.col, e.shiftKey); }
    return;
  }

  if (!selectedCell) return;
  let { row, col } = selectedCell;
  if (e.key === 'ArrowUp') { e.preventDefault(); selectCell(Math.max(0, row-1), col, e.shiftKey); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); selectCell(Math.min(ROWS-1, row+1), col, e.shiftKey); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); selectCell(row, Math.max(0, col-1), e.shiftKey); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); selectCell(row, Math.min(COLS-1, col+1), e.shiftKey); }
  else if (e.key === 'Home') { e.preventDefault(); selectCell(row, 0); }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    const refs = rangeRefs();
    const hasContent = refs.some(ref => cellData[ref]);
    if (hasContent) {
      pushHistory();
      refs.forEach(ref => { delete cellData[ref]; delete cellStyles[ref]; });
      saveData();
      renderGrid();
      updateCellName(selectedCell);
    }
  }
});

  });
  loadCatalog().then(() => {
    feedSymbolsChanged();
    refreshMarket(true).then(() => {
      renderGrid();
      if (selectedCell) updateCellName(selectedCell);
    });
  });
});
